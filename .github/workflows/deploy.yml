name: Fitbit Pipeline CI/CD

on:
  push:
    branches: [ main ]

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    - name: Run tests
      run: |
        python -m pytest tests/ -v

    - name: Configure AWS
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-2

    - name: Deploy Glue Silver script
      run: |
        aws s3 cp phase2/glue_silver.py \
          s3://aws-glue-assets-224125369177-us-east-2/scripts/glue_silver.py
        echo "Silver script deployed!"

    - name: Deploy Glue Gold script
      run: |
        aws s3 cp phase2/glue_gold.py \
          s3://aws-glue-assets-224125369177-us-east-2/scripts/glue_gold.py
        echo "Gold script deployed!"

    - name: Deploy Lambda function
      run: |
        cd phase3
        zip lambda.zip lambda_fxn.py
        aws lambda update-function-code \
          --function-name fitbit-event-detector \
          --zip-file fileb://lambda.zip
        echo "Lambda deployed!"